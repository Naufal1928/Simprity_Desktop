<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simprity - Edit Kegiatan</title>
    <link rel="stylesheet" href="css/daftar_kegiatan.css">
    <style>
        /* Specific adjustments for this page */
        .header-title-purple {
            color: #6200EE !important;
        }

        .main-content {
            padding-top: 1rem;
            overflow-x: hidden;
        }

        .header {
            background-color: #f5f3ff;
            padding: 1.5rem 3rem 1.5rem 1.5rem;
            /* Teks mepet ke kiri */
            border-radius: 0 16px 16px 0;
            /* Persegi diteruskan ke navbar (kiri datar) */
            margin-bottom: 2.5rem;
            margin-top: 1.5rem;
            /* Header dibawakan sedikit */
            margin-left: -3rem;
            /* Menempel ke navbar */
            width: calc(100% + 3rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-body {
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        /* Edit Actions */
        .activity-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .edit-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #e5e7eb; /* Light gray */
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-circle:hover {
            background-color: #d1d5db;
        }

        .btn-circle.selected {
            background-color: #a78bfa; /* Purple when selected */
            border: 2px solid #8b5cf6;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #d1d5db; /* Light gray icon */
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .btn-delete:hover {
            color: #ef4444; /* Red on hover */
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/logo1.png" alt="Simprity Logo">
            <h2>SIMPRITY</h2>
        </div>

        <nav class="nav-menu">
            <a href="home.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                Beranda
            </a>
            <a href="daftar_kegiatan.html" class="nav-item active">
                <i class="fa-regular fa-clipboard"></i>
                Daftar Kegiatan
            </a>
            <a href="statistik.html" class="nav-item">
                <i class="fa-solid fa-chart-simple"></i>
                Statistik
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-regular fa-user"></i>
                Profile
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <div class="header">
            <div class="header-text">
                <h1 class="header-title-purple" style="font-size: 2rem;">Edit Kegiatan</h1>
            </div>
            <div class="header-actions">
                <a href="notifikasi.html" class="btn-icon">
                    <i class="fa-regular fa-bell"></i>
                </a>
            </div>
        </div>

        <div class="main-body">
            <!-- Activity List -->
            <div class="activity-list" id="edit-activity-container">
                <p style="text-align: center; color: #6b7280; padding: 2rem;">Memuat data kegiatan...</p>
            </div>

        </div>
    </main>

    <!-- Supabase Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabaseClient.js"></script>
    <script src="js/edit.js"></script>
</body>

</html>
