<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simprity - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container-split">

        <!-- LEFT -->
        <div class="split-left">

            <img src="assets/logo.png" alt="Simprity Logo" class="logo-img">

            <h2 style="font-size: 1.5rem; color: #111; margin-top: 1rem;">
                Selamat Datang Kembali
            </h2>

            <p>
                Masuk untuk melanjutkan pengalaman menggunakan Simprity
            </p>

        </div>

        <!-- RIGHT -->
        <div class="split-right">

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">EMAIL</label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 
                                1.1.9 2 2 2h16c1.1 0 2-.9 
                                2-2V6c0-1.1-.9-2-2-2zm0 4l-8 
                                5-8-5V6l8 5 8-5v2z" />
                            </svg>
                        </span>

                        <input type="email" id="email" class="form-control" placeholder="Masukan Email.." required>

                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">PASSWORD</label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 
                                3.24 7 6v2H6c-1.1 0-2 .9-2 
                                2v10c0 1.1.9 2 2 
                                2h12c1.1 0 2-.9 
                                2-2V10c0-1.1-.9-2-2-2zm-6 
                                9c-1.1 0-2-.9-2-2s.9-2 
                                2-2 2 .9 2 
                                2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 
                                1.39-3.1 3.1-3.1 1.71 0 3.1 
                                1.39 3.1 3.1v2z" />
                            </svg>
                        </span>

                        <input type="password" id="password" class="form-control" placeholder="Isi Password.." required>

                        <button type="button" class="toggle-password" onclick="togglePassword()">

                            <svg viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 
                                12c1.73 4.39 6 7.5 11 
                                7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 
                                17c-2.76 0-5-2.24-5-5s2.24-5 
                                5-5 5 2.24 5 
                                5-2.24 5-5 5zm0-8c-1.66 
                                0-3 1.34-3 3s1.34 3 3 
                                3 3-1.34 3-3-1.34-3-3-3z" />
                            </svg>

                        </button>

                    </div>

                </div>

                <!-- BUTTON -->
                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">

                    Masuk

                </button>

                <div class="form-footer">
                    Belum punya akun?
                    <a href="register.html">
                        Daftar
                    </a>
                </div>
                <div id="loginError" class="error-message" style="color: red; text-align: center; margin-top: 10px; display: none;"></div>
            </form>

        </div>

    </div>

    <script>
        // SHOW PASSWORD
        function togglePassword() {
            const password = document.getElementById("password");
            password.type = password.type === "password" ? "text" : "password";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
